[`cintro`,`C introduction`,`A fast, low-level language.`,`<p>C powers operating systems, embedded devices and databases. It is compiled: you write source code, a compiler turns it into a program. Many later languages (C++, Java, C#) borrow its syntax.</p>`,`#include <stdio.h>\n\nint main() {\n  printf("Hello, C!\\n");\n  return 0;\n}`,`Hello, C!`],
[`cstart`,`C get started`,`Install a compiler and build.`,`<p>Install <code>gcc</code> (or use an online compiler or an IDE like Code::Blocks). Save as <code>main.c</code>, compile with <code>gcc main.c -o main</code> and run <code>./main</code>.</p>`,`/* Terminal:\n   gcc main.c -o main\n   ./main\n*/\n#include <stdio.h>\nint main() {\n  printf("It works\\n");\n  return 0;\n}`,`It works`],
[`csyntax`,`C syntax`,`Parts of a C program.`,`<p><code>#include</code> loads a library. <code>main()</code> is where execution starts. Statements end with <code>;</code>. Braces group code. <code>return 0</code> reports success.</p>`,`#include <stdio.h>\n\nint main() {\n  printf("Syntax\\n");\n  return 0;\n}`,`Syntax`],
[`coutput`,`C output`,`Print with printf.`,`<p><code>printf</code> prints text. <code>\\n</code> starts a new line and <code>\\t</code> adds a tab. Format codes insert values: <code>%d</code> int, <code>%f</code> float, <code>%c</code> char, <code>%s</code> string.</p>`,`#include <stdio.h>\nint main() {\n  printf("Line 1\\nLine 2\\n");\n  printf("Age %d, pi %.2f, grade %c\\n", 20, 3.14159, 'A');\n  return 0;\n}`,`Line 1\nLine 2\nAge 20, pi 3.14, grade A`],
[`ccomments`,`C comments`,`Notes for humans.`,`<p><code>//</code> comments one line, <code>/* ... */</code> comments many lines.</p>`,`#include <stdio.h>\nint main() {\n  // single line\n  /* multi\n     line */\n  printf("Comments ignored\\n");\n  return 0;\n}`,`Comments ignored`],
[`cvars`,`C variables`,`Named storage for values.`,`<p>Declare with a type: <code>int age = 20;</code>. Names use letters, digits and underscores and cannot start with a digit. Declare several at once: <code>int a=1, b=2;</code>.</p>`,`#include <stdio.h>\nint main() {\n  int age = 20;\n  float price = 9.99;\n  char grade = 'B';\n  printf("%d %.2f %c\\n", age, price, grade);\n  return 0;\n}`,`20 9.99 B`],
[`ctypes`,`C data types`,`Sizes and formats.`,`<p><code>char</code> 1 byte, <code>int</code> usually 4, <code>float</code> 4, <code>double</code> 8. Use <code>sizeof</code> to check on your machine.</p>`,`#include <stdio.h>\nint main() {\n  printf("%zu %zu %zu %zu\\n", sizeof(char), sizeof(int), sizeof(float), sizeof(double));\n  return 0;\n}`,`1 4 4 8`],
[`cconv`,`C type conversion`,`Implicit and explicit casts.`,`<p>Mixed types convert automatically, and integer division drops decimals. Cast with <code>(float)</code> to force a decimal result.</p>`,`#include <stdio.h>\nint main() {\n  int a = 5, b = 2;\n  printf("%d\\n", a / b);\n  printf("%.2f\\n", (float) a / b);\n  return 0;\n}`,`2\n2.50`],
[`cconst`,`C constants`,`Values that cannot change.`,`<p>Use <code>const</code> to protect a variable. Write constant names in capitals by habit. <code>#define</code> makes a text replacement.</p>`,`#include <stdio.h>\n#define MAX 100\nint main() {\n  const float PI = 3.14;\n  printf("%.2f %d\\n", PI, MAX);\n  return 0;\n}`,`3.14 100`],
[`cops`,`C operators`,`Arithmetic, comparison, logic.`,`<p>Arithmetic <code>+ - * / %</code>, assignment <code>+= -=</code>, comparison <code>== != &lt; &gt;</code>, logic <code>&amp;&amp; || !</code>, and <code>++</code> / <code>--</code>.</p>`,`#include <stdio.h>\nint main() {\n  int x = 10;\n  x += 5; x++;\n  printf("%d %d %d\\n", x, x % 4, x > 10 && x < 20);\n  return 0;\n}`,`16 0 1`],
[`cbool`,`C booleans`,`True and false.`,`<p>C treats 0 as false and any other value as true. Include <code>stdbool.h</code> for <code>bool</code>, <code>true</code> and <code>false</code>.</p>`,`#include <stdio.h>\n#include <stdbool.h>\nint main() {\n  bool ok = true;\n  printf("%d %d\\n", ok, 5 > 9);\n  return 0;\n}`,`1 0`],
[`cif`,`C if...else`,`Choose between paths.`,`<p>Use <code>if</code>, <code>else if</code>, <code>else</code>, or the short form <code>cond ? a : b</code>.</p>`,`#include <stdio.h>\nint main() {\n  int t = 18;\n  if (t < 12) printf("Morning\\n");\n  else if (t < 17) printf("Afternoon\\n");\n  else printf("Evening\\n");\n  return 0;\n}`,`Evening`],
[`cswitch`,`C switch`,`Many choices on one value.`,`<p>Each <code>case</code> needs <code>break</code> or execution falls through. <code>default</code> catches the rest.</p>`,`#include <stdio.h>\nint main() {\n  int d = 3;\n  switch (d) {\n    case 1: printf("Mon\\n"); break;\n    case 3: printf("Wed\\n"); break;\n    default: printf("Other\\n");\n  }\n  return 0;\n}`,`Wed`],
[`cwhile`,`C while loop`,`Repeat while true.`,`<p><code>do { } while</code> runs at least once. Make sure the condition eventually becomes false.</p>`,`#include <stdio.h>\nint main() {\n  int i = 1;\n  while (i <= 3) { printf("%d ", i); i++; }\n  printf("\\n");\n  return 0;\n}`,`1 2 3`],
[`cfor`,`C for loop`,`Count with a loop.`,`<p><code>for (start; condition; step)</code> keeps everything about the count in one line.</p>`,`#include <stdio.h>\nint main() {\n  for (int i = 0; i < 5; i += 2) printf("%d ", i);\n  printf("\\n");\n  return 0;\n}`,`0 2 4`],
[`cbreak`,`C break and continue`,`Leave or skip.`,`<p><code>break</code> exits the loop. <code>continue</code> skips to the next round.</p>`,`#include <stdio.h>\nint main() {\n  for (int i = 1; i <= 6; i++) {\n    if (i == 2) continue;\n    if (i == 5) break;\n    printf("%d ", i);\n  }\n  printf("\\n");\n  return 0;\n}`,`1 3 4`],
[`carrays`,`C arrays`,`Many values of one type.`,`<p>Index starts at 0. C does not check bounds, so stay inside the size. Get the length with <code>sizeof(a)/sizeof(a[0])</code>.</p>`,`#include <stdio.h>\nint main() {\n  int a[] = {10, 20, 30};\n  int n = sizeof(a) / sizeof(a[0]);\n  for (int i = 0; i < n; i++) printf("%d ", a[i]);\n  printf("\\n");\n  return 0;\n}`,`10 20 30`],
[`cstrings`,`C strings`,`Character arrays ending in 0.`,`<p>A string is a <code>char</code> array ending with <code>'\\0'</code>. Use <code>string.h</code>: <code>strlen</code>, <code>strcpy</code>, <code>strcat</code>, <code>strcmp</code>.</p>`,`#include <stdio.h>\n#include <string.h>\nint main() {\n  char s[20] = "Hello";\n  strcat(s, " C");\n  printf("%s %zu %d\\n", s, strlen(s), strcmp("a", "a"));\n  return 0;\n}`,`Hello C 7 0`],
[`cinput`,`C user input`,`Read with scanf and fgets.`,`<p><code>scanf("%d", &amp;n)</code> reads a number (note the <code>&amp;</code>). Use <code>fgets</code> to read a whole line safely.</p>`,`#include <stdio.h>\nint main() {\n  int n;\n  char name[30];\n  printf("Number: ");\n  scanf("%d", &n);\n  getchar();\n  printf("Name: ");\n  fgets(name, 30, stdin);\n  printf("%d %s", n, name);\n  return 0;\n}`,`Number: 7\nName: Ada\n7 Ada`],
[`caddr`,`C memory address`,`Where a variable lives.`,`<p><code>&amp;x</code> gives the address of <code>x</code>. Print it with <code>%p</code>. The value differs every run.</p>`,`#include <stdio.h>\nint main() {\n  int x = 5;\n  printf("%d at %p\\n", x, (void*) &x);\n  return 0;\n}`,`5 at 0x7ffd...  (address varies)`],
[`cptr`,`C pointers`,`Variables that hold addresses.`,`<p>Declare with <code>*</code>. <code>p = &amp;x</code> stores an address; <code>*p</code> reads or changes the value there (dereference). Arrays decay to pointers.</p>`,`#include <stdio.h>\nint main() {\n  int x = 5, *p = &x;\n  *p = 9;\n  printf("%d %d\\n", x, *p);\n  int a[] = {1, 2, 3};\n  printf("%d\\n", *(a + 2));\n  return 0;\n}`,`9 9\n3`],
[`cfunc`,`C functions`,`Reusable blocks.`,`<p>Define a return type, name and parameters. Declare a prototype above <code>main</code> if the definition comes after it.</p>`,`#include <stdio.h>\nint square(int n);\nint main() {\n  printf("%d\\n", square(6));\n  return 0;\n}\nint square(int n) { return n * n; }`,`36`],
[`cparams`,`Function parameters`,`Pass values and arrays.`,`<p>Arguments are copied. An array parameter becomes a pointer, so pass the size too.</p>`,`#include <stdio.h>\nint sum(int a[], int n) {\n  int s = 0;\n  for (int i = 0; i < n; i++) s += a[i];\n  return s;\n}\nint main() {\n  int v[] = {1, 2, 3, 4};\n  printf("%d\\n", sum(v, 4));\n  return 0;\n}`,`10`],
[`cref`,`Pass by reference`,`Change the caller's variable.`,`<p>Pass the address and use a pointer parameter, as in a swap.</p>`,`#include <stdio.h>\nvoid swap(int *a, int *b) { int t = *a; *a = *b; *b = t; }\nint main() {\n  int x = 1, y = 2;\n  swap(&x, &y);\n  printf("%d %d\\n", x, y);\n  return 0;\n}`,`2 1`],
[`cscope`,`C scope`,`Where names are visible.`,`<p>Local variables exist only inside their block. Globals are visible everywhere but make code harder to follow.</p>`,`#include <stdio.h>\nint g = 100;\nint main() {\n  int x = 5;\n  { int x = 9; printf("%d ", x); }\n  printf("%d %d\\n", x, g);\n  return 0;\n}`,`9 5 100`],
[`cmath`,`C math functions`,`math.h helpers.`,`<p>Include <code>math.h</code>: <code>sqrt</code>, <code>pow</code>, <code>ceil</code>, <code>floor</code>, <code>fabs</code>. Link with <code>-lm</code> on some systems.</p>`,`#include <stdio.h>\n#include <math.h>\nint main() {\n  printf("%.1f %.0f %.0f %.1f\\n", sqrt(49), pow(2, 5), ceil(4.1), fabs(-3.5));\n  return 0;\n}`,`7.0 32 5 3.5`],
[`crecur`,`C recursion`,`A function that calls itself.`,`<p>Needs a base case to stop. Each call uses stack memory, so very deep recursion can crash.</p>`,`#include <stdio.h>\nint fact(int n) { return n <= 1 ? 1 : n * fact(n - 1); }\nint main() {\n  printf("%d\\n", fact(5));\n  return 0;\n}`,`120`],
[`cfptr`,`C function pointers`,`Store a function in a variable.`,`<p>Declare as <code>int (*f)(int,int)</code>. Used for callbacks and menus.</p>`,`#include <stdio.h>\nint add(int a, int b) { return a + b; }\nint mul(int a, int b) { return a * b; }\nint main() {\n  int (*f)(int, int) = mul;\n  printf("%d %d\\n", add(2, 3), f(2, 3));\n  return 0;\n}`,`5 6`],
[`cfwrite`,`C create and write files`,`Save text to a file.`,`<p><code>fopen(name, "w")</code> creates or overwrites. Use <code>"a"</code> to append. Write with <code>fprintf</code> and always <code>fclose</code>.</p>`,`#include <stdio.h>\nint main() {\n  FILE *f = fopen("data.txt", "w");\n  if (f == NULL) { printf("Error\\n"); return 1; }\n  fprintf(f, "Hello file\\n");\n  fclose(f);\n  printf("Saved\\n");\n  return 0;\n}`,`Saved`],
[`cfread`,`C read files`,`Read text from a file.`,`<p>Open with <code>"r"</code> and read lines with <code>fgets</code> until it returns NULL.</p>`,`#include <stdio.h>\nint main() {\n  char line[100];\n  FILE *f = fopen("data.txt", "r");\n  if (!f) { printf("Missing\\n"); return 1; }\n  while (fgets(line, 100, f)) printf("%s", line);\n  fclose(f);\n  return 0;\n}`,`Hello file`],
[`cstruct`,`C structures`,`Group different types.`,`<p>A <code>struct</code> bundles related fields. Access with <code>.</code>; use <code>-&gt;</code> through a pointer.</p>`,`#include <stdio.h>\n#include <string.h>\nstruct Student { char name[20]; int age; };\nint main() {\n  struct Student s = {"Ada", 21};\n  printf("%s %d\\n", s.name, s.age);\n  return 0;\n}`,`Ada 21`],
[`cnested`,`Nested structs and arrays of structs`,`Structs inside structs, and lists of them.`,`<p>Fields can be other structs, and you can make arrays of structs.</p>`,`#include <stdio.h>\nstruct Pt { int x, y; };\nstruct Line { struct Pt a, b; };\nint main() {\n  struct Line l = {{0, 0}, {3, 4}};\n  struct Pt p[2] = {{1, 2}, {5, 6}};\n  printf("%d %d\\n", l.b.y, p[1].x);\n  return 0;\n}`,`4 5`],
[`cstructptr`,`Structs and pointers`,`Use -> on struct pointers.`,`<p>Pass struct pointers to avoid copying. <code>p-&gt;x</code> equals <code>(*p).x</code>.</p>`,`#include <stdio.h>\nstruct Pt { int x, y; };\nvoid move(struct Pt *p) { p->x += 10; }\nint main() {\n  struct Pt a = {1, 2};\n  move(&a);\n  printf("%d %d\\n", a.x, a.y);\n  return 0;\n}`,`11 2`],
[`cunion`,`C unions`,`Fields share one memory slot.`,`<p>A <code>union</code> holds one member at a time; its size is the largest member. Writing one overwrites the others.</p>`,`#include <stdio.h>\nunion U { int i; float f; };\nint main() {\n  union U u; u.i = 7;\n  printf("%d %zu\\n", u.i, sizeof(u));\n  return 0;\n}`,`7 4`],
[`ctypedef`,`C typedef`,`Give a type a shorter name.`,`<p><code>typedef</code> removes the need to write <code>struct</code> each time.</p>`,`#include <stdio.h>\ntypedef struct { int x, y; } Point;\nint main() {\n  Point p = {3, 4};\n  printf("%d\\n", p.x + p.y);\n  return 0;\n}`,`7`],
[`cpadding`,`C struct padding`,`Hidden gaps for alignment.`,`<p>The compiler adds padding so fields sit on aligned addresses. Ordering fields from large to small can shrink the struct.</p>`,`#include <stdio.h>\nstruct A { char c; int i; char d; };\nstruct B { int i; char c; char d; };\nint main() {\n  printf("%zu %zu\\n", sizeof(struct A), sizeof(struct B));\n  return 0;\n}`,`12 8`],
[`cenum`,`C enums`,`Named integer constants.`,`<p><code>enum</code> assigns names to numbers starting at 0 unless you set values.</p>`,`#include <stdio.h>\nenum Level { LOW, MEDIUM = 5, HIGH };\nint main() {\n  enum Level l = HIGH;\n  printf("%d %d\\n", LOW, l);\n  return 0;\n}`,`0 6`],
[`cmalloc`,`C allocate and access memory`,`malloc gives memory at run time.`,`<p><code>malloc(bytes)</code> returns a pointer, or NULL on failure. Use <code>sizeof</code>, check the result, and use it like an array.</p>`,`#include <stdio.h>\n#include <stdlib.h>\nint main() {\n  int *a = malloc(3 * sizeof(int));\n  if (a == NULL) return 1;\n  for (int i = 0; i < 3; i++) a[i] = i * 10;\n  printf("%d %d\\n", a[1], a[2]);\n  free(a);\n  return 0;\n}`,`10 20`],
[`crealloc`,`C reallocate memory`,`Resize a block.`,`<p><code>realloc</code> grows or shrinks a block and may move it. Store the result in a temporary pointer so you do not lose the original on failure.</p>`,`#include <stdio.h>\n#include <stdlib.h>\nint main() {\n  int *a = malloc(2 * sizeof(int));\n  a[0] = 1; a[1] = 2;\n  int *t = realloc(a, 4 * sizeof(int));\n  if (t == NULL) { free(a); return 1; }\n  a = t; a[3] = 4;\n  printf("%d %d\\n", a[1], a[3]);\n  free(a);\n  return 0;\n}`,`2 4`],
[`cfree`,`C deallocate memory`,`Free what you allocate.`,`<p>Every <code>malloc</code> needs one <code>free</code>. Set the pointer to NULL afterwards. Forgetting causes a memory leak.</p>`,`#include <stdio.h>\n#include <stdlib.h>\nint main() {\n  int *p = malloc(sizeof(int));\n  *p = 42;\n  printf("%d\\n", *p);\n  free(p);\n  p = NULL;\n  return 0;\n}`,`42`],
[`cmemmistake`,`C memory mistakes`,`Common bugs.`,`<p>Leaks, use after free, double free, writing outside an array, using uninitialized pointers and forgetting to check for NULL. Tools like Valgrind and AddressSanitizer find them.</p>`,`/* Compile with: gcc -fsanitize=address main.c */\n#include <stdlib.h>\nint main() {\n  int *p = malloc(4);\n  free(p);\n  /* *p = 1;   use after free: never do this */\n  /* free(p);  double free: never do this   */\n  return 0;\n}`,`(no output)`],
[`cnull`,`C NULL and errors`,`Detect failure.`,`<p>Many functions return NULL or -1 on failure. Check results before using them. <code>perror</code> and <code>errno</code> describe the problem.</p>`,`#include <stdio.h>\nint main() {\n  FILE *f = fopen("missing.txt", "r");\n  if (f == NULL) { perror("fopen"); return 1; }\n  fclose(f);\n  return 0;\n}`,`fopen: No such file or directory`],
[`cvalid`,`C input validation`,`Never trust input.`,`<p>Check what <code>scanf</code> returns and range-check values before using them.</p>`,`#include <stdio.h>\nint main() {\n  int n;\n  if (scanf("%d", &n) != 1 || n < 1 || n > 10) {\n    printf("Enter 1 to 10\\n");\n    return 1;\n  }\n  printf("OK %d\\n", n);\n  return 0;\n}`,`(input abc)\nEnter 1 to 10`],
[`cdate`,`C date and time`,`time.h basics.`,`<p><code>time(NULL)</code> returns seconds since 1970. <code>localtime</code> and <code>strftime</code> format it.</p>`,`#include <stdio.h>\n#include <time.h>\nint main() {\n  time_t now = time(NULL);\n  char b[40];\n  strftime(b, 40, "%Y-%m-%d", localtime(&now));\n  printf("%s\\n", b);\n  return 0;\n}`,`2026-11-01  (today's date)`],
[`crandom`,`C random numbers`,`rand and srand.`,`<p>Seed once with <code>srand(time(NULL))</code>, then use <code>rand() % n</code> for 0 to n-1.</p>`,`#include <stdio.h>\n#include <stdlib.h>\n#include <time.h>\nint main() {\n  srand(time(NULL));\n  printf("%d\\n", rand() % 6 + 1);\n  return 0;\n}`,`4  (random 1 to 6)`],
[`cmacro`,`C macros`,`Text replacement by the preprocessor.`,`<p><code>#define</code> can take arguments. Wrap parameters in parentheses. <code>#ifdef</code> compiles code conditionally.</p>`,`#include <stdio.h>\n#define SQ(x) ((x) * (x))\nint main() {\n  printf("%d\\n", SQ(3 + 1));\n  return 0;\n}`,`16`],

[`cfixed`,`C fixed-width integers`,`Exact sizes with stdint.h.`,`<p><code>int8_t</code>, <code>uint16_t</code>, <code>int32_t</code>, <code>uint64_t</code> have the same size on every platform.</p>`,`#include <stdio.h>\n#include <stdint.h>\nint main() {\n  uint8_t x = 255; x++;\n  int32_t y = 100000;\n  printf("%u %d %zu\\n", x, y, sizeof(int64_t));\n  return 0;\n}`,`0 100000 8`],
[`ccmd`,`C command-line arguments`,`Pass values when launching.`,`<p><code>main(int argc, char *argv[])</code>: <code>argc</code> counts arguments, <code>argv[0]</code> is the program name.</p>`,`#include <stdio.h>\nint main(int argc, char *argv[]) {\n  printf("%d args\\n", argc);\n  for (int i = 0; i < argc; i++) printf("%s\\n", argv[i]);\n  return 0;\n}`,`(run: ./main hi)\n2 args\n./main\nhi`],
[`csearch`,`C searching (DSA)`,`Linear and binary search.`,`<p>Linear search checks each item. Binary search halves a sorted array each step, so it is much faster on big data.</p>`,`#include <stdio.h>\nint bsearch2(int a[], int n, int t) {\n  int lo = 0, hi = n - 1;\n  while (lo <= hi) {\n    int m = (lo + hi) / 2;\n    if (a[m] == t) return m;\n    if (a[m] < t) lo = m + 1; else hi = m - 1;\n  }\n  return -1;\n}\nint main() {\n  int a[] = {1, 3, 5, 7, 9};\n  printf("%d\\n", bsearch2(a, 5, 7));\n  return 0;\n}`,`3`],
[`csort`,`C sorting (DSA)`,`Bubble sort.`,`<p>Bubble sort swaps neighbours that are out of order. It is simple but slow (O(n squared)). Real code uses <code>qsort</code>.</p>`,`#include <stdio.h>\nint main() {\n  int a[] = {5, 2, 9, 1}, n = 4;\n  for (int i = 0; i < n - 1; i++)\n    for (int j = 0; j < n - 1 - i; j++)\n      if (a[j] > a[j + 1]) { int t = a[j]; a[j] = a[j + 1]; a[j + 1] = t; }\n  for (int i = 0; i < n; i++) printf("%d ", a[i]);\n  printf("\\n");\n  return 0;\n}`,`1 2 5 9`],
[`cstack`,`C stacks and queues (DSA)`,`Last-in first-out and first-in first-out.`,`<p>A stack pushes and pops at one end (LIFO). A queue adds at the back and removes from the front (FIFO). Both fit in an array.</p>`,`#include <stdio.h>\nint main() {\n  int s[10], top = -1;\n  s[++top] = 1; s[++top] = 2; s[++top] = 3;\n  printf("pop %d\\n", s[top--]);\n  int q[10], f = 0, r = 0;\n  q[r++] = 1; q[r++] = 2;\n  printf("dequeue %d\\n", q[f++]);\n  return 0;\n}`,`pop 3\ndequeue 1`],
[`clist`,`C linked lists (DSA)`,`Nodes linked by pointers.`,`<p>Each node stores data and a pointer to the next. Insert at the head in constant time.</p>`,`#include <stdio.h>\n#include <stdlib.h>\nstruct N { int v; struct N *next; };\nint main() {\n  struct N *h = NULL;\n  for (int i = 1; i <= 3; i++) {\n    struct N *n = malloc(sizeof *n);\n    n->v = i; n->next = h; h = n;\n  }\n  for (struct N *p = h; p; p = p->next) printf("%d ", p->v);\n  printf("\\n");\n  return 0;\n}`,`3 2 1`],

[`ppintro`,`C++ introduction and get started`,`C with classes, built for speed.`,`<p>C++ extends C with objects, templates and a big standard library (STL). It is used in games, browsers and finance. Install <code>g++</code> (or an IDE), save as <code>main.cpp</code>, compile with <code>g++ main.cpp -o main</code> and run <code>./main</code>.</p>`,`#include <iostream>\nusing namespace std;\n\nint main() {\n  cout << "Hello, C++!" << endl;\n  return 0;\n}`,`Hello, C++!`],

[`ppinput`,`C++ user input`,`Read with cin.`,`<p><code>cin &gt;&gt; x</code> reads one value. Use <code>getline(cin, s)</code> to read a whole line with spaces.</p>`,`#include <iostream>\n#include <string>\nusing namespace std;\nint main() {\n  int n; string name;\n  cout << "Number: "; cin >> n;\n  cin.ignore();\n  cout << "Name: "; getline(cin, name);\n  cout << n << " " << name << endl;\n  return 0;\n}`,`Number: 7\nName: Ada Lovelace\n7 Ada Lovelace`],
[`pptypes`,`C++ data types`,`Sizes and kinds.`,`<p><code>int</code>, <code>double</code>, <code>float</code>, <code>char</code>, <code>bool</code>, <code>string</code>. Check sizes with <code>sizeof</code>.</p>`,`#include <iostream>\nusing namespace std;\nint main() {\n  cout << sizeof(int) << " " << sizeof(double) << " " << sizeof(char) << " " << sizeof(bool) << endl;\n  return 0;\n}`,`4 8 1 1`],

[`ppstr`,`C++ strings`,`The string class.`,`<p>Include <code>string</code>. Join with <code>+</code>, use <code>length()</code>, <code>substr</code>, <code>find</code>, <code>append</code> and index with <code>[]</code>.</p>`,`#include <iostream>\n#include <string>\nusing namespace std;\nint main() {\n  string s = "Hello";\n  s += " World";\n  cout << s << " " << s.length() << " " << s.substr(0, 5) << " " << s[1] << " " << s.find("World") << endl;\n  return 0;\n}`,`Hello World 11 Hello e 6`],
[`ppmath`,`C++ math`,`cmath functions.`,`<p>Include <code>cmath</code> for <code>sqrt</code>, <code>pow</code>, <code>round</code>, <code>ceil</code>, <code>floor</code>, <code>abs</code>. <code>max</code> and <code>min</code> need no header.</p>`,`#include <iostream>\n#include <cmath>\nusing namespace std;\nint main() {\n  cout << sqrt(64) << " " << pow(2, 10) << " " << round(2.6) << " " << max(3, 8) << endl;\n  return 0;\n}`,`8 1024 3 8`],
[`ppif`,`C++ if...else and switch`,`Make decisions.`,`<p>Use <code>if</code>, <code>else if</code>, <code>else</code>, the ternary <code>?:</code> and <code>switch</code> with <code>break</code>.</p>`,`#include <iostream>\nusing namespace std;\nint main() {\n  int t = 18, d = 3;\n  if (t < 12) cout << "Morning" << endl;\n  else cout << "Later" << endl;\n  switch (d) {\n    case 1: cout << "Mon" << endl; break;\n    case 3: cout << "Wed" << endl; break;\n    default: cout << "Other" << endl;\n  }\n  return 0;\n}`,`Later\nWed`],

[`ppstruct`,`C++ structures and enums`,`Group data, name constants.`,`<p>A <code>struct</code> bundles fields. <code>enum</code> names integer constants; <code>enum class</code> keeps names scoped and safer.</p>`,`#include <iostream>\nusing namespace std;\nstruct Car { string brand; int year; };\nenum class Level { Low, High };\nint main() {\n  Car c = {"Tata", 2024};\n  Level l = Level::High;\n  cout << c.brand << " " << c.year << " " << (int) l << endl;\n  return 0;\n}`,`Tata 2024 1`],
[`ppref`,`C++ references`,`Another name for a variable.`,`<p>A reference (<code>int &amp;r = x;</code>) must be set when created and always points to the same variable. Changing it changes the original.</p>`,`#include <iostream>\nusing namespace std;\nint main() {\n  int x = 5;\n  int &r = x;\n  r = 9;\n  cout << x << " " << r << endl;\n  return 0;\n}`,`9 9`],

[`ppvector`,`C++ STL and vectors`,`Growable arrays.`,`<p>The STL gives ready-made containers. A <code>vector</code> grows automatically: <code>push_back</code>, <code>pop_back</code>, <code>size</code>, <code>at</code>.</p>`,`#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n  vector<int> v = {3, 1, 2};\n  v.push_back(9);\n  for (int x : v) cout << x << " ";\n  cout << "size " << v.size() << endl;\n  return 0;\n}`,`3 1 2 9 size 4`],
[`pplist`,`C++ list`,`Doubly linked list.`,`<p>A <code>list</code> inserts and removes anywhere in constant time, but has no <code>[]</code> access. Use <code>push_front</code> and <code>push_back</code>.</p>`,`#include <iostream>\n#include <list>\nusing namespace std;\nint main() {\n  list<int> l = {2, 3};\n  l.push_front(1); l.push_back(4);\n  for (int x : l) cout << x << " ";\n  cout << endl;\n  return 0;\n}`,`1 2 3 4`],
[`ppstack`,`C++ stacks and queues`,`LIFO and FIFO.`,`<p>A <code>stack</code> uses <code>push</code>, <code>top</code>, <code>pop</code>. A <code>queue</code> uses <code>push</code>, <code>front</code>, <code>pop</code>.</p>`,`#include <iostream>\n#include <stack>\n#include <queue>\nusing namespace std;\nint main() {\n  stack<int> s; s.push(1); s.push(2);\n  queue<int> q; q.push(1); q.push(2);\n  cout << s.top() << " " << q.front() << endl;\n  return 0;\n}`,`2 1`],
[`ppdeque`,`C++ deque`,`Add or remove at both ends.`,`<p>A <code>deque</code> supports <code>push_front</code>, <code>push_back</code> and <code>[]</code> access.</p>`,`#include <iostream>\n#include <deque>\nusing namespace std;\nint main() {\n  deque<int> d = {2, 3};\n  d.push_front(1); d.push_back(4);\n  cout << d[0] << " " << d.back() << " " << d.size() << endl;\n  return 0;\n}`,`1 4 4`],
[`ppset`,`C++ sets`,`Sorted unique values.`,`<p>A <code>set</code> keeps unique items in order. Use <code>insert</code>, <code>count</code>, <code>erase</code>.</p>`,`#include <iostream>\n#include <set>\nusing namespace std;\nint main() {\n  set<int> s = {5, 1, 5, 3};\n  s.insert(2);\n  for (int x : s) cout << x << " ";\n  cout << s.count(3) << endl;\n  return 0;\n}`,`1 2 3 5 1`],
[`ppmap`,`C++ maps`,`Key-value pairs.`,`<p>A <code>map</code> stores sorted key-value pairs. Access with <code>[]</code>, search with <code>find</code>.</p>`,`#include <iostream>\n#include <map>\nusing namespace std;\nint main() {\n  map<string, int> age = {{"Ravi", 30}};\n  age["Ada"] = 36;\n  for (auto &p : age) cout << p.first << "=" << p.second << " ";\n  cout << endl;\n  return 0;\n}`,`Ada=36 Ravi=30`],
[`ppiter`,`C++ iterators`,`Pointers into containers.`,`<p><code>begin()</code> and <code>end()</code> give iterators. Use <code>*it</code> for the value and <code>++it</code> to move.</p>`,`#include <iostream>\n#include <vector>\nusing namespace std;\nint main() {\n  vector<int> v = {4, 5, 6};\n  for (auto it = v.begin(); it != v.end(); ++it) cout << *it << " ";\n  cout << endl;\n  return 0;\n}`,`4 5 6`],
[`ppalgo`,`C++ algorithms`,`sort, find, count and more.`,`<p>Include <code>algorithm</code>. They work on iterator ranges: <code>sort</code>, <code>reverse</code>, <code>find</code>, <code>count</code>, <code>max_element</code>.</p>`,`#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\nint main() {\n  vector<int> v = {5, 2, 9, 1};\n  sort(v.begin(), v.end());\n  for (int x : v) cout << x << " ";\n  cout << *max_element(v.begin(), v.end()) << endl;\n  return 0;\n}`,`1 2 5 9 9`],
[`ppns`,`C++ namespaces`,`Avoid name clashes.`,`<p>A <code>namespace</code> groups names. Use <code>name::item</code>. Avoid <code>using namespace std;</code> in large projects.</p>`,`#include <iostream>\nnamespace Math { int twice(int x) { return x * 2; } }\nint main() {\n  std::cout << Math::twice(21) << std::endl;\n  return 0;\n}`,`42`],
[`ppadd`,`C++ how to: add two numbers`,`Read two numbers and add.`,`<p>Read with <code>cin</code> and print the sum.</p>`,`#include <iostream>\nusing namespace std;\nint main() {\n  int a, b;\n  cout << "Two numbers: ";\n  cin >> a >> b;\n  cout << "Sum = " << a + b << endl;\n  return 0;\n}`,`Two numbers: 4 6\nSum = 10`],
[`pprand`,`C++ how to: random numbers`,`Use the random library.`,`<p>Modern way: a <code>mt19937</code> engine seeded by <code>random_device</code> and a distribution.</p>`,`#include <iostream>\n#include <random>\nusing namespace std;\nint main() {\n  random_device rd;\n  mt19937 gen(rd());\n  uniform_int_distribution<int> dice(1, 6);\n  cout << dice(gen) << endl;\n  return 0;\n}`,`4  (random 1 to 6)`]
);
L.php={n:"PHP",c:"#777bb3",items:[]};
L.php.items.push(
[`phpintro`,`PHP introduction`,`A server-side language that powers much of the web.`,`<p>PHP (PHP: Hypertext Preprocessor) runs on the <b>server</b> and sends plain HTML to the browser. It powers WordPress, Laravel and countless sites. PHP code lives between <code>&lt;?php</code> and <code>?&gt;</code> tags, in files ending in <code>.php</code>.</p>`,`<?php
echo "Hello, PHP!";
?>`,`Hello, PHP!`],
[`phpinstall`,`PHP install and syntax`,`Set up PHP and learn the basic rules.`,`<p>Install PHP (or XAMPP), save a file as <code>index.php</code> and start the built-in server with <code>php -S localhost:8000</code>. Every statement ends with a semicolon. Comments use <code>//</code>, <code>#</code> or <code>/* */</code>. Keywords like <code>echo</code> are not case-sensitive, but variable names are.</p>`,`<?php
// a comment
# another comment
/* a multi-line
   comment */
echo "Statements end with a semicolon.";
Echo " Keywords are not case-sensitive.";
?>`,`Statements end with a semicolon. Keywords are not case-sensitive.`],
[`phpvars`,`PHP variables`,`Store values in variables that start with $.`,`<p>A variable starts with <code>$</code> followed by a name. There is no type keyword: PHP picks the type from the value. Double-quoted strings insert variable values; single-quoted strings do not.</p>`,`<?php
$name = "Ada";
$age = 36;
$age = $age + 1;
echo "$name is $age";
?>`,`Ada is 37`],
[`phpecho`,`PHP echo and print`,`Send output to the page.`,`<p><code>echo</code> can take several values and has no return value. <code>print</code> takes one value and returns 1. Join strings with the dot operator. <code>PHP_EOL</code> is a line break.</p>`,`<?php
echo "Hello", " ", "World", PHP_EOL;
print "print returns 1" . PHP_EOL;
$x = 5;
echo "x is " . $x . PHP_EOL;
?>`,`Hello World
print returns 1
x is 5`],
[`phpdatatypes`,`PHP data types`,`Strings, integers, floats, booleans, arrays and null.`,`<p><code>var_dump</code> shows both the type and the value of anything, which makes it the best debugging tool in PHP.</p>`,`<?php
var_dump("text");
var_dump(42);
var_dump(3.14);
var_dump(true);
var_dump([1, 2]);
var_dump(null);
?>`,`string(4) "text"
int(42)
float(3.14)
bool(true)
array(2) {
  [0]=>
  int(1)
  [1]=>
  int(2)
}
NULL`],
[`phpstrings`,`PHP strings`,`Measure, search and change text.`,`<p>PHP has hundreds of string functions. Common ones are <code>strlen</code>, <code>strtoupper</code>, <code>str_replace</code> and <code>strpos</code>. Positions start counting at 0.</p>`,`<?php
$s = "Hello, World";
echo strlen($s) . PHP_EOL;
echo strtoupper($s) . PHP_EOL;
echo str_replace("World", "PHP", $s) . PHP_EOL;
echo strpos($s, "World") . PHP_EOL;
?>`,`12
HELLO, WORLD
Hello, PHP
7`],
[`phpmath`,`PHP numbers and math`,`Calculate with built-in math functions.`,`<p>Use <code>max</code>, <code>round</code>, <code>sqrt</code>, <code>pow</code> and <code>intdiv</code> for everyday maths. The <code>%</code> operator gives the remainder.</p>`,`<?php
echo max(3, 9, 5) . PHP_EOL;
echo round(3.14159, 2) . PHP_EOL;
echo sqrt(81) . PHP_EOL;
echo pow(2, 10) . PHP_EOL;
echo intdiv(17, 5) . PHP_EOL;
echo (17 % 5) . PHP_EOL;
?>`,`9
3.14
9
1024
3
2`],
[`phpif`,`PHP if...else...elseif`,`Make decisions in code.`,`<p>Combine conditions with <code>&amp;&amp;</code> (and), <code>||</code> (or) and <code>!</code> (not). Use <code>===</code> to compare value and type.</p>`,`<?php
$score = 72;
if ($score >= 90) {
  echo "A";
} elseif ($score >= 70) {
  echo "B";
} else {
  echo "C";
}
?>`,`B`],
[`phpswitch`,`PHP switch and match`,`Pick one of many branches.`,`<p><code>match</code> (PHP 8) is a stricter, shorter <code>switch</code>. It returns a value and uses strict comparison, so no <code>break</code> is needed.</p>`,`<?php
$day = 3;
echo match($day) {
  1 => "Mon",
  2 => "Tue",
  3 => "Wed",
  default => "Other",
};
?>`,`Wed`],
[`phploops`,`PHP loops`,`Repeat code with for, while and foreach.`,`<p><code>for</code> counts, <code>while</code> repeats while a condition holds, and <code>foreach</code> walks through an array.</p>`,`<?php
for ($i = 1; $i <= 5; $i++) {
  echo $i . " ";
}
echo PHP_EOL;
$n = 3;
while ($n > 0) {
  echo $n-- . " ";
}
echo PHP_EOL;
foreach (["red", "green"] as $c) {
  echo $c . PHP_EOL;
}
?>`,`1 2 3 4 5 
3 2 1 
red
green`],
[`phpfunctions`,`PHP functions`,`Reuse code with named blocks.`,`<p>Functions can have typed parameters, default values and a return type. Arrow functions (<code>fn</code>) are a short form for one-line functions.</p>`,`<?php
function greet(string $name, string $greeting = "Hello"): string {
  return "$greeting, $name!";
}
echo greet("Ada") . PHP_EOL;
echo greet("Bob", "Hi") . PHP_EOL;
$sq = fn($n) => $n * $n;
echo $sq(5);
?>`,`Hello, Ada!
Hi, Bob!
25`],
[`phparrays`,`PHP arrays`,`Indexed and associative arrays.`,`<p>An indexed array uses numbers as keys; an associative array uses names. <code>[]</code> appends, <code>count</code> counts, <code>sort</code> orders and <code>implode</code> joins items into a string.</p>`,`<?php
$f = ["pear", "apple"];
$f[] = "plum";
echo count($f) . PHP_EOL;
sort($f);
echo implode(", ", $f) . PHP_EOL;
$p = ["name" => "Ada", "age" => 36];
$p["city"] = "London";
foreach ($p as $k => $v) {
  echo "$k: $v" . PHP_EOL;
}
?>`,`3
apple, pear, plum
name: Ada
age: 36
city: London`],
[`phpforms`,`PHP superglobals and form handling`,`Read what the visitor submitted.`,`<p>Superglobals such as <code>$_GET</code>, <code>$_POST</code>, <code>$_SERVER</code> and <code>$_SESSION</code> are available everywhere. Always clean user input with <code>htmlspecialchars</code> before printing it, to prevent XSS attacks. The example fills <code>$_POST</code> by hand because there is no real form here.</p>`,`<?php
$_POST["name"] = "<b>Ada</b>";   // pretend a form sent this
$name = htmlspecialchars($_POST["name"] ?? "guest");
echo "Hello, " . $name;
?>`,`Hello, &lt;b&gt;Ada&lt;/b&gt;`],
[`phpdate`,`PHP date and time`,`Format dates with date() and mktime().`,`<p><code>date(format, timestamp)</code> turns a timestamp into text: <code>Y</code> year, <code>m</code> month, <code>d</code> day, <code>l</code> weekday name. <code>mktime</code> builds a timestamp from hour, minute, second, month, day and year.</p>`,`<?php
$t = mktime(0, 0, 0, 12, 25, 2026);
echo date("Y-m-d", $t) . PHP_EOL;
echo date("l", $t);
?>`,`2026-12-25
Friday`],
[`phpsessions`,`PHP cookies and sessions`,`Remember a visitor between pages.`,`<p>A cookie is stored in the browser (<code>setcookie</code>). A session stores data on the server and gives the browser only an id. Call <code>session_start()</code> before any output, then use <code>$_SESSION</code>.</p>`,`<?php
session_start();
$_SESSION["user"] = "Ada";
echo "Logged in as " . $_SESSION["user"];
?>`,`Logged in as Ada`],
[`phpjson`,`PHP JSON`,`Exchange data with JavaScript and APIs.`,`<p><code>json_encode</code> turns an array or object into JSON text. <code>json_decode($text, true)</code> turns it back into an associative array.</p>`,`<?php
$data = ["name" => "Ada", "langs" => ["PHP", "JS"]];
$json = json_encode($data);
echo $json . PHP_EOL;
$back = json_decode($json, true);
echo $back["langs"][1];
?>`,`{"name":"Ada","langs":["PHP","JS"]}
JS`],
[`phpexceptions`,`PHP exceptions`,`Handle errors safely with try and catch.`,`<p><code>throw</code> raises an exception, <code>catch</code> handles it, and <code>finally</code> always runs, even after an error.</p>`,`<?php
function div($a, $b) {
  if ($b === 0) throw new Exception("Cannot divide by zero");
  return $a / $b;
}
try {
  echo div(10, 2) . PHP_EOL;
  echo div(1, 0);
} catch (Exception $e) {
  echo "Error: " . $e->getMessage();
} finally {
  echo PHP_EOL . "Done";
}
?>`,`5
Error: Cannot divide by zero
Done`],
[`phpclasses`,`PHP classes, objects and constructors`,`Model things with object-oriented code.`,`<p>A class is a blueprint and an object is one instance made with <code>new</code>. The <code>__construct</code> method runs when the object is created. Use <code>$this</code> to reach the object's own properties.</p>`,`<?php
class Car {
  public string $brand;
  public function __construct(string $brand) {
    $this->brand = $brand;
  }
  public function honk(): string {
    return $this->brand . " says beep";
  }
}
$c = new Car("Volvo");
echo $c->honk();
?>`,`Volvo says beep`],
[`phpinherit`,`PHP inheritance`,`Reuse and override behaviour in child classes.`,`<p>A child class <code>extends</code> a parent and inherits its properties and methods. Mark members <code>protected</code> to share them with children but hide them from outside code.</p>`,`<?php
class Animal {
  public function __construct(protected string $name) {}
  public function speak(): string {
    return $this->name . " makes a sound";
  }
}
class Dog extends Animal {
  public function speak(): string {
    return $this->name . " barks";
  }
}
foreach ([new Animal("Cat"), new Dog("Rex")] as $a) {
  echo $a->speak() . PHP_EOL;
}
?>`,`Cat makes a sound
Rex barks`],
[`phpmysql`,`PHP MySQL prepared statements`,`Talk to a database without SQL injection.`,`<p>Connect with <code>mysqli</code> (or PDO). Never put user input straight into SQL. A <b>prepared statement</b> sends the query with <code>?</code> placeholders first and binds the values separately, which blocks SQL injection. This needs a real MySQL server, so the output below is what you would see.</p>`,`<?php
$conn = new mysqli("localhost", "user", "password", "myDB");
$stmt = $conn->prepare("INSERT INTO users (name, email) VALUES (?, ?)");
$stmt->bind_param("ss", $name, $email);
$name = "Ada";
$email = "ada@example.com";
$stmt->execute();
echo "New record created successfully";
$stmt->close();
$conn->close();
?>`,`New record created successfully`]
);

L.sql.items.push(
[`sqlintro`,`SQL introduction`,`The language for talking to databases.`,`<p>SQL (Structured Query Language) stores, reads, changes and deletes data in relational databases such as MySQL, PostgreSQL, SQL Server and SQLite. Data lives in <b>tables</b> made of rows and columns. All lessons use two sample tables: <code>Customers</code> (id, name, city, country) with Ada, Bob, Chen, Dev and Eva, and <code>Orders</code> (id, customer_id, amount) with four orders.</p>`,`SELECT * FROM Customers;`,`+----+------+--------+---------+
| id | name | city   | country |
+----+------+--------+---------+
| 1  | Ada  | London | UK      |
| 2  | Bob  | Paris  | France  |
| 3  | Chen | Berlin | Germany |
| 4  | Dev  | Mumbai | India   |
| 5  | Eva  | London | UK      |
+----+------+--------+---------+`],
[`sqlselect`,`SQL SELECT and DISTINCT`,`Choose columns and remove duplicates.`,`<p><code>SELECT</code> picks the columns to show. <code>SELECT DISTINCT</code> removes repeated values. Keywords are not case-sensitive and every statement ends with a semicolon. Comments start with <code>--</code>.</p>`,`-- columns
SELECT name, city FROM Customers;

-- unique values
SELECT DISTINCT country FROM Customers;`,`+------+--------+
| name | city   |
+------+--------+
| Ada  | London |
| Bob  | Paris  |
| Chen | Berlin |
| Dev  | Mumbai |
| Eva  | London |
+------+--------+

+---------+
| country |
+---------+
| UK      |
| France  |
| Germany |
| India   |
+---------+`],
[`sqlwhere`,`SQL WHERE`,`Filter rows with a condition.`,`<p><code>WHERE</code> keeps only the rows that match. Text values go in single quotes. Operators: <code>=</code>, <code>&lt;&gt;</code>, <code>&gt;</code>, <code>&lt;</code>, <code>&gt;=</code>, <code>&lt;=</code>.</p>`,`SELECT name, city FROM Customers
WHERE country = 'UK';`,`+------+--------+
| name | city   |
+------+--------+
| Ada  | London |
| Eva  | London |
+------+--------+`],
[`sqlorder`,`SQL ORDER BY and LIMIT`,`Sort results and take the first few.`,`<p><code>ORDER BY</code> sorts ascending (<code>ASC</code>, the default) or descending (<code>DESC</code>). <code>LIMIT n</code> returns only n rows (MySQL, PostgreSQL, SQLite). SQL Server uses <code>SELECT TOP n</code>, and Oracle uses <code>FETCH FIRST n ROWS ONLY</code>.</p>`,`SELECT name, country FROM Customers
ORDER BY country ASC, name DESC
LIMIT 3;`,`+------+---------+
| name | country |
+------+---------+
| Bob  | France  |
| Chen | Germany |
| Dev  | India   |
+------+---------+`],
[`sqlandor`,`SQL AND, OR, NOT`,`Combine conditions.`,`<p><code>AND</code> needs both conditions true, <code>OR</code> needs one, <code>NOT</code> reverses a condition. Use parentheses to make the order clear.</p>`,`SELECT name, city, country FROM Customers
WHERE (country = 'UK' OR country = 'India')
  AND NOT city = 'London';`,`+------+--------+---------+
| name | city   | country |
+------+--------+---------+
| Dev  | Mumbai | India   |
+------+--------+---------+`],
[`sqlinsert`,`SQL INSERT INTO and NULL`,`Add rows and handle missing values.`,`<p><code>INSERT INTO</code> adds a row. A column you skip gets <code>NULL</code>, meaning no value. You cannot test NULL with <code>=</code>; use <code>IS NULL</code> or <code>IS NOT NULL</code>.</p>`,`INSERT INTO Customers (id, name, country)
VALUES (6, 'Fay', 'UK');

SELECT name, city FROM Customers
WHERE city IS NULL;`,`+------+------+
| name | city |
+------+------+
| Fay  | NULL |
+------+------+`],
[`sqlupdate`,`SQL UPDATE`,`Change existing rows.`,`<p><code>UPDATE ... SET</code> changes values. <b>Always add WHERE</b>: without it every row in the table is changed.</p>`,`UPDATE Customers
SET city = 'Delhi'
WHERE id = 4;

SELECT name, city FROM Customers
WHERE id = 4;`,`+------+-------+
| name | city  |
+------+-------+
| Dev  | Delhi |
+------+-------+`],
[`sqldelete`,`SQL DELETE`,`Remove rows.`,`<p><code>DELETE FROM</code> removes rows. Like <code>UPDATE</code>, it needs a <code>WHERE</code> or it empties the whole table. There is no undo, so test with <code>SELECT</code> first.</p>`,`DELETE FROM Customers
WHERE id = 5;

SELECT COUNT(*) AS total FROM Customers;`,`+-------+
| total |
+-------+
| 4     |
+-------+`],
[`sqlagg`,`SQL aggregate functions`,`MIN, MAX, COUNT, SUM and AVG.`,`<p>Aggregate functions turn many rows into one value: <code>MIN</code>, <code>MAX</code>, <code>COUNT</code>, <code>SUM</code> and <code>AVG</code>. <code>COUNT(*)</code> counts rows. They ignore NULL values (except <code>COUNT(*)</code>).</p>`,`SELECT MIN(amount) AS lowest,
       MAX(amount) AS highest,
       COUNT(*)    AS orders,
       SUM(amount) AS total,
       AVG(amount) AS average
FROM Orders;`,`+--------+---------+--------+-------+---------+
| lowest | highest | orders | total | average |
+--------+---------+--------+-------+---------+
| 20     | 80      | 4      | 180   | 45.0000 |
+--------+---------+--------+-------+---------+`],
[`sqllike`,`SQL LIKE and wildcards`,`Search for text patterns.`,`<p><code>LIKE</code> matches patterns. <code>%</code> stands for any number of characters and <code>_</code> for exactly one. <code>'C%'</code> starts with C, <code>'%a'</code> ends with a, <code>'%an%'</code> contains "an".</p>`,`SELECT name FROM Customers
WHERE name LIKE '%a';`,`+------+
| name |
+------+
| Ada  |
| Eva  |
+------+`],
[`sqlin`,`SQL IN and BETWEEN`,`Match a list or a range.`,`<p><code>IN</code> is a short way to write many <code>OR</code> tests. <code>BETWEEN a AND b</code> includes both ends of the range.</p>`,`SELECT name FROM Customers
WHERE country IN ('UK', 'India');

SELECT id, amount FROM Orders
WHERE amount BETWEEN 25 AND 60;`,`+------+
| name |
+------+
| Ada  |
| Dev  |
| Eva  |
+------+

+-----+--------+
| id  | amount |
+-----+--------+
| 101 | 50     |
| 102 | 30     |
+-----+--------+`],
[`sqlalias`,`SQL aliases`,`Give columns and tables temporary names.`,`<p><code>AS</code> renames a column in the result, or a table inside the query. Aliases make long queries easier to read.</p>`,`SELECT name AS customer, city AS town
FROM Customers
WHERE id <= 2;`,`+----------+--------+
| customer | town   |
+----------+--------+
| Ada      | London |
| Bob      | Paris  |
+----------+--------+`],
[`sqlinner`,`SQL INNER JOIN`,`Combine rows from two tables.`,`<p>A join links tables through matching columns. <code>INNER JOIN</code> keeps only rows that match on both sides. Here <code>Orders.customer_id</code> points to <code>Customers.id</code> (a foreign key).</p>`,`SELECT c.name, o.amount
FROM Customers c
INNER JOIN Orders o ON c.id = o.customer_id
ORDER BY o.id;`,`+------+--------+
| name | amount |
+------+--------+
| Ada  | 50     |
| Bob  | 30     |
| Ada  | 20     |
| Dev  | 80     |
+------+--------+`],
[`sqlleft`,`SQL LEFT, RIGHT, FULL and SELF JOIN`,`Keep rows even when there is no match.`,`<p><code>LEFT JOIN</code> keeps every row of the left table and fills missing matches with NULL. <code>RIGHT JOIN</code> does the same for the right table, and <code>FULL JOIN</code> keeps both sides (not available in MySQL). A <b>self join</b> joins a table to itself using two aliases. This query finds customers with no orders.</p>`,`SELECT c.name, o.amount
FROM Customers c
LEFT JOIN Orders o ON c.id = o.customer_id
WHERE o.id IS NULL;`,`+------+--------+
| name | amount |
+------+--------+
| Chen | NULL   |
| Eva  | NULL   |
+------+--------+`],
[`sqlunion`,`SQL UNION and UNION ALL`,`Stack the results of two queries.`,`<p><code>UNION</code> joins the results of two <code>SELECT</code>s and removes duplicates. <code>UNION ALL</code> keeps duplicates. Both queries need the same number of columns with compatible types.</p>`,`SELECT city FROM Customers WHERE country = 'UK'
UNION
SELECT city FROM Customers WHERE city = 'Paris'
ORDER BY city;`,`+--------+
| city   |
+--------+
| London |
| Paris  |
+--------+`],
[`sqlgroup`,`SQL GROUP BY and HAVING`,`Summarise rows by group.`,`<p><code>GROUP BY</code> makes one row per group so aggregates work per group. <code>WHERE</code> filters rows <i>before</i> grouping; <code>HAVING</code> filters the groups <i>after</i>.</p>`,`SELECT country, COUNT(*) AS total
FROM Customers
GROUP BY country
HAVING COUNT(*) > 1;`,`+---------+-------+
| country | total |
+---------+-------+
| UK      | 2     |
+---------+-------+`],
[`sqlcase`,`SQL CASE`,`If-then-else inside a query.`,`<p><code>CASE</code> returns a value depending on conditions, like <code>if / else if / else</code>. Functions such as <code>COALESCE(x, y)</code> (or <code>IFNULL</code> / <code>ISNULL</code>) replace NULL with a default.</p>`,`SELECT id,
  CASE
    WHEN amount >= 50 THEN 'big'
    ELSE 'small'
  END AS size
FROM Orders;`,`+-----+-------+
| id  | size  |
+-----+-------+
| 101 | big   |
| 102 | small |
| 103 | small |
| 104 | big   |

C(`h1`,`h`,`Defines the main heading of the page. Use one per page.`,`<h1>Heading text</h1>`,`<h1>Welcome</h1>`);

C(`href`,`h`,`Attribute of a that sets where the link goes.`,`<a href="URL">text</a>`,`<a href="https://example.com">Go</a>`);
C(`img`,`h`,`Embeds an image in the page.`,`<img src="file" alt="description">`,`<img src="x.png" alt="A sleeping cat">`);
C(`alt`,`h`,`Text description of an image, shown if it fails to load and read by screen readers.`,`<img src="file" alt="text">`,`<img src="x.png" alt="A sleeping cat">`);

C(`ol`,`h`,`Ordered (numbered) list.`,`<ol><li>item</li></ol>`,`<ol><li>Mix</li><li>Bake</li></ol>`);

C(`required`,`h`,`Attribute that forces a field to be filled before submit.`,`<input required>`,`<form><input required><button>Send</button></form>`);
C(`color`,`c`,`Sets the text color.`,`color: value;`,`color: crimson;`);
C(`padding`,`c`,`Adds space inside an element, between content and border.`,`padding: size;`,`padding: 12px;\nbackground: skyblue;`);
C(`margin`,`c`,`Adds space outside an element.`,`margin: size;`,`margin: 24px;\nbackground: skyblue;`);
C(`text-align`,`c`,`Aligns text horizontally.`,`text-align: left | center | right;`,`text-align: center;`);
C(`display`,`c`,`Sets how an element is laid out: block, inline, flex, grid or none.`,`display: value;`,`display: flex;\njustify-content: center;`);

C(`const`,`j`,`Declares a variable that cannot be reassigned.`,`const name = value;`,`const pi = 3.14;\nconsole.log(pi);`);
C(`let`,`j`,`Declares a variable that can change. It lives inside its block.`,`let name = value;`,`let n = 1;\nn = n + 1;\nconsole.log(n);`);
C(`console.log`,`j`,`Prints a value for debugging.`,`console.log(value);`,`console.log("Sum:", 2 + 3);`);
C(`addEventListener`,`j`,`Runs a function when an event happens on an element.`,`element.addEventListener("event", function);`,`document.body.addEventListener("click", function(){\n  console.log("clicked");\n});`);
C(`setTimeout`,`j`,`Runs a function once after a delay in milliseconds.`,`setTimeout(function, ms);`,`setTimeout(function(){ console.log("later"); }, 1000);`);
C(`setInterval`,`j`,`Runs a function again and again every given milliseconds.`,`setInterval(function, ms);`,`var i = 0;\nvar t = setInterval(function(){\n  console.log(++i);\n  if (i === 3) clearInterval(t);\n}, 500);`);
C(`push`,`j`,`Adds an item to the end of an array.`,`array.push(item);`,`const a = [1, 2];\na.push(3);\nconsole.log(a);`);

C(`JSON.parse`,`j`,`Converts JSON text back into an object.`,`JSON.parse(text);`,`console.log(JSON.parse('{"a":1}').a);`);
